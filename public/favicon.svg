<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Neon Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="12"/>
  
  <!-- Subtle Internal Glow Screen -->
  <rect x="48" y="48" width="416" height="416" rx="80" fill="none" stroke="url(#glowGrad)" stroke-width="4" opacity="0.5"/>

  <!-- TV Display Screen Outline -->
  <rect x="96" y="128" width="320" height="232" rx="36" fill="#111827" stroke="url(#accentGrad)" stroke-width="14" filter="url(#neonGlow)"/>

  <!-- TV Antenna / Signal Light -->
  <circle cx="256" cy="92" r="10" fill="#38bdf8" filter="url(#neonGlow)"/>
  <path d="M216 128 L256 92 L296 128" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Glowing Play Button Symbol -->
  <polygon points="228,188 324,244 228,300" fill="url(#accentGrad)" filter="url(#neonGlow)"/>

  <!-- TV Stand Base -->
  <path d="M192 384 L320 384 M256 360 L256 384" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
